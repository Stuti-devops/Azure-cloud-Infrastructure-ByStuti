trigger: 
 branches:
   include:
     - feature/*
     - main
pool: Default
stages:
  - stage: Buildnpm
    jobs:
      - job: BuildNPM
        steps:
        - task: NodeTool@0
          inputs:
            versionSource: 'spec'
            versionSpec: '16.x'

        - task: Npm@1
          inputs:
            command: 'install'
            workingDir: '$(System.DefaultWorkingDirectory)'

        - task: Npm@1
          inputs:
            command: 'custom'
            workingDir: '$(System.DefaultWorkingDirectory)'
            customCommand: 'run build'
    
        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(System.DefaultWorkingDirectory)/build'
            ArtifactName: 'StutiTodo'
            publishLocation: 'Container'

        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: 'StutiTodo'
            downloadPath: '$(System.ArtifactsDirectory)'

        - task: CopyFilesOverSSH@0
          inputs:
            sshEndpoint: 'StutiNewTodoConnection'
            sourceFolder: '$(System.ArtifactsDirectory)/StutiTodo'
            contents: '**'
            targetFolder: '/temp/todoapp'
            readyTimeout: '20000'

        - task: SSH@0
          inputs:
            sshEndpoint: 'StutiNewTodoConnection'
            runOptions: 'commands'
            commands: 'sudo cp -r /temp/todoapp/* /var/www/html'
            readyTimeout: '20000'

